  <style>

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
/** Globe→Tide: camera distance to Earth center. r=1.6, FOV=45° → ~1.4× screen fill at 2.72. */
const GLOBE_TO_TIDE_DIST = 2.72;

/* Phone-only framing. Desktop / tablet keep prior distances.
   Root cause of "solar system only in a corner" on phones:
   (1) OrbitControls target followed the selected planet — zooming out orbited Earth, so the Sun disk sat off-frame;
   (2) canvas lacked touch-action:none so browser often stole pinch;
   (3) portrait FOV was too narrow + overview opened too close. */
function isPhoneViewport() {
  const w = Math.min(window.innerWidth || 0, (document.documentElement && document.documentElement.clientWidth) || window.innerWidth || 0) || window.innerWidth;
  const h = Math.min(window.innerHeight || 0, (document.documentElement && document.documentElement.clientHeight) || window.innerHeight || 0) || window.innerHeight;
  const shortSide = Math.min(w, h);
  // Phones: CSS short side ≤500. iPad mini short side ~768 → untouched.
  if (shortSide > 0 && shortSide <= 500) return true;
  try {
    if (window.matchMedia("(max-width: 640px)").matches) return true;
  } catch (_) {}
  return false;
}
function syncPhoneCameraOptics() {
  if (!isPhoneViewport()) {
    if (camera.fov !== 45) {
      camera.fov = 45;
      camera.far = 2000;
      camera.updateProjectionMatrix();
    }
    controls.zoomSpeed = 1.0;
    return;
  }
  // Wider FOV → usable horizontal view on tall portrait screens
  if (camera.fov !== 62) {
    camera.fov = 62;
    camera.far = 12000;
    camera.updateProjectionMatrix();
  }
  controls.zoomSpeed = 1.55;
}
/** Distance so a sphere of `radius` fits in the narrower FOV with padding. */
function viewFitDistance(radius, pad) {
  pad = pad == null ? 1.18 : pad;
  syncPhoneCameraOptics();
  const vFov = (camera.fov * Math.PI) / 180;
  const aspect = Math.max(camera.aspect || (window.innerWidth / Math.max(window.innerHeight, 1)), 0.35);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  const lim = Math.min(vFov, hFov);
  return (radius / Math.tan(lim / 2)) * pad;
}
function globeCamDistance() {
  const r = typeof GLOBE_EARTH_R === "number" ? GLOBE_EARTH_R : 1.6;
  if (!isPhoneViewport()) return 5.68;
  return Math.max(viewFitDistance(r * 1.02, 1.25), 5.2);
}
function globeCamPos() {
  const d = globeCamDistance();
  if (!isPhoneViewport()) return new THREE.Vector3(0, 1.4, 5.5);
  return new THREE.Vector3(0, d * 0.04, d * 0.999);
}
function globeDistLimits() {
  const r = typeof GLOBE_EARTH_R === "number" ? GLOBE_EARTH_R : 1.6;
  if (!isPhoneViewport()) return { min: 1.85, max: 12 };
  return {
    min: Math.max(r * 1.12, 1.75),
    max: Math.max(viewFitDistance(r * 1.02, 1.25) * 3.2, 22),
  };
}
function systemDistLimits() {
  if (!isPhoneViewport()) return { min: 8, max: 200 };
  // Neptune ~98; leave huge headroom — do not clamp the overview
  const fit = viewFitDistance(115, 1.2);
  return { min: 5, max: Math.max(fit * 1.35, 900) };
}
function systemOverviewCam() {
  if (!isPhoneViewport()) return new THREE.Vector3(18, 28, 72);
  // Frame the FULL system (past Neptune) with low elevation so the ecliptic is centered, not stuck at the bottom edge
  const d = viewFitDistance(115, 1.22);
  return new THREE.Vector3(d * 0.12, d * 0.1, d * 0.988);
}
function applyGlobeFraming(snap) {
  syncPhoneCameraOptics();
  const lim = globeDistLimits();
  controls.minDistance = lim.min;
  controls.maxDistance = lim.max;
  controls.target.set(0, 0, 0);
  if (snap) {
    camera.position.copy(globeCamPos());
    controls.update();
  }
}
function applySystemFramingLimits() {
  syncPhoneCameraOptics();
  const lim = systemDistLimits();
  controls.minDistance = lim.min;
  controls.maxDistance = lim.max;
}
function applySystemOverview(snap) {
  applySystemFramingLimits();
  controls.target.set(0, 0, 0);
  if (snap) {
    camera.position.copy(systemOverviewCam());
    controls.update();
  }
}

/* starfield */
(function makeStars() {
  const count = 2500;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 180 + Math.random() * 420;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
    pos[i * 3 + 2] = r * Math.cos(ph);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: 0xc8d4e8, size: 0.55, sizeAttenuation: true, transparent: true, opacity: 0.85 });
  scene.add(new THREE.Points(g, m));
})();

const loader = new THREE.TextureLoader();
loader.crossOrigin = "anonymous";
let texturesPending = 0;
function loadTex(url, onLoad) {
  texturesPending++;
  texStatus.textContent = t("texLoading");
  return loader.load(
    url,
    (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texturesPending--;
      if (texturesPending <= 0) texStatus.textContent = t("texOk");
      if (onLoad) onLoad(tex);
    },
    undefined,
    () => {
      texturesPending--;
      if (texturesPending <= 0) texStatus.textContent = t("texOk");
    }
  );
}

function makeOrbit(dist) {
  const pts = [];
  const seg = 128;
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x5ec8d8, transparent: true, opacity: 0.18 }));
  systemRoot.add(line);
  orbitLines.push(line);
}

function makeBodyMesh(def) {
  const seg = 64;
  const geo = new THREE.SphereGeometry(def.radius, seg, seg);
  let mat;
  const tune = MAT_TUNE[def.id];

  if (def.emissive) {
    mat = new THREE.MeshStandardMaterial({
      color: 0xffd898,
      emissive: new THREE.Color(0xffa028),
      emissiveIntensity: 0.55,
      roughness: 0.45,
      metalness: 0.05,
    });
    loadTex(PTEX.sun, (t) => {
      mat.map = t;
      mat.emissiveMap = t;
      mat.color.set(0xfff0d0);
      mat.needsUpdate = true;
    });
  } else {
    const albedo = tune ? tune.albedo : def.color;
    mat = new THREE.MeshStandardMaterial({
      color: albedo,
      roughness: tune ? tune.roughness : 0.75,
      metalness: tune ? tune.metalness : 0.06,
      emissive: new THREE.Color(albedo),
      emissiveIntensity: 0.42,
    });
  }

  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.id = def.id;
  mesh.userData.def = def;

  if (def.id === "earth") {
    loadTex(TEX.earth, (t) => { mat.map = t; mat.color.set(0xffffff); mat.emissiveMap = t; mat.emissive.set(0xffffff); mat.emissiveIntensity = 0.4; mat.needsUpdate = true; });
    loadTex(TEX.earthNormal, (t) => { mat.normalMap = t; mat.normalScale.set(1.15, 1.15); mat.needsUpdate = true; });
    loadTex(TEX.earthSpec, (t) => { mat.roughnessMap = t; mat.metalness = 0.18; mat.roughness = 0.48; mat.needsUpdate = true; });
    const clouds = new THREE.Mesh(
      new THREE.SphereGeometry(def.radius * 1.018, 64, 64),
      new THREE.MeshStandardMaterial({
        color: 0xffffff, transparent: true, opacity: 0.42, depthWrite: false,
        roughness: 1, metalness: 0,
      })
    );
    loadTex(TEX.clouds, (t) => { clouds.material.map = t; clouds.material.needsUpdate = true; });
    mesh.add(clouds);
    mesh.userData.clouds = clouds;
  } else if (def.id === "mars") {
    loadTex(PTEX.mars, (t) => { mat.map = t; mat.color.set(0xffffff); mat.emissiveMap = t; mat.emissive.set(0xffffff); mat.emissiveIntensity = 0.4; mat.needsUpdate = true; });
    loadTex(PTEX.marsBump, (t) => { mat.bumpMap = t; mat.bumpScale = 0.1; mat.needsUpdate = true; });
  } else if (def.id === "venus") {
    loadTex(PTEX.venus, (t) => { mat.map = t; mat.color.set(0xffffff); mat.emissiveMap = t; mat.emissive.set(0xffffff); mat.emissiveIntensity = 0.4; mat.needsUpdate = true; });
  } else if (!def.emissive && PTEX[def.id]) {
    const tint = { jupiter: 0xfff5ea, saturn: 0xffffff, uranus: 0xf0ffff, neptune: 0xe8f0ff, mercury: 0xffffff, moon: 0xffffff };
    loadTex(PTEX[def.id], (t) => {
      mat.map = t;
      mat.color.set(0xffffff);
      mat.emissiveMap = t;
      mat.emissive.set(0xffffff);
      mat.emissiveIntensity = 0.4;
      mat.needsUpdate = true;
    });
    if (def.id === "mercury" && PTEX.mercuryBump) {
      loadTex(PTEX.mercuryBump, (t) => { mat.bumpMap = t; mat.bumpScale = 0.04; mat.needsUpdate = true; });
    }
    if (def.id === "moon" && PTEX.moonBump) {
      loadTex(PTEX.moonBump, (t) => { mat.bumpMap = t; mat.bumpScale = 0.05; mat.needsUpdate = true; });
    }
  }

  if (def.rings) {
    const ringGeo = new THREE.RingGeometry(def.radius * 1.35, def.radius * 2.35, 96);
    const pos = ringGeo.attributes.position;
    const uv = ringGeo.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      const r = Math.sqrt(x * x + y * y);
      uv.setXY(i, (r - def.radius * 1.35) / (def.radius), 0.5);
    }
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0xf2e6c8, side: THREE.DoubleSide, transparent: true, opacity: 0.92,
      roughness: 0.55, metalness: 0.08, depthWrite: false,
    });
    loadTex(PTEX.saturnRing, (t) => { ringMat.map = t; ringMat.color.set(0xffffff); ringMat.needsUpdate = true; });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.15;
    mesh.add(ring);
  }

  return mesh;
}

/* Standalone Earth for globe phase (closer, richer) */
const globeEarth = makeBodyMesh({ id: "earth", zh: "地球", en: "Earth", radius: 1.6, dist: 0, color: COLORS.earth, period: 1 });
globeEarth.position.set(0, 0, 0);
globeEarth.visible = false;
scene.add(globeEarth);

/* Globe-phase Moon: system moon is under systemRoot (hidden during 审视地球 / return-to-Earth).
   Keep a twin beside globeEarth so the Moon stays visible throughout the Earth globe sequence. */
const GLOBE_EARTH_R = 1.6;
const SYS_EARTH_R = 0.9;
const GLOBE_SCALE = GLOBE_EARTH_R / SYS_EARTH_R;
const moonDef = BODIES.find((b) => b.id === "moon") || { radius: 0.28, orbitRadius: 1.85, period: 0.074 };
const globeMoon = makeBodyMesh({
  id: "moon", zh: "月球", en: "Moon",
  radius: (moonDef.radius || 0.28) * GLOBE_SCALE,
  dist: null, parent: "earth",
  orbitRadius: (moonDef.orbitRadius || 1.85) * GLOBE_SCALE,
  color: COLORS.moon, period: moonDef.period || 0.074,
});
globeMoon.userData.angle = Math.PI * 0.55;
globeMoon.userData.orbitRadius = (moonDef.orbitRadius || 1.85) * GLOBE_SCALE;
globeMoon.visible = false;
scene.add(globeMoon);

function setGlobeMoonVisible(on) {
  if (!globeMoon) return;
  globeMoon.visible = !!on;
  if (on) updateGlobeMoonOrbit(0, false);
}

function updateGlobeMoonOrbit(dt, advance) {
  if (!globeMoon || !globeEarth) return;
  const orbitR = globeMoon.userData.orbitRadius || 3.3;
  if (advance) {
    const period = (moonDef && moonDef.period) || 0.074;
    const speed = 0.1 / Math.max(period, 0.05);
    globeMoon.userData.angle = (globeMoon.userData.angle || 0) + dt * speed;
  }
  const a = globeMoon.userData.angle || 0;
  globeMoon.position.copy(globeEarth.position).add(
    new THREE.Vector3(Math.cos(a) * orbitR, Math.sin(a) * 0.15 * orbitR, Math.sin(a) * orbitR)
  );
  if (advance) globeMoon.rotation.y += dt * 0.06;
}

BODIES.forEach((def) => {
  // Sun-orbiting planets only (satellites like Moon skip heliocentric orbit rings)
  if (def.dist != null && def.dist > 0 && !def.parent) makeOrbit(def.dist);
  const mesh = makeBodyMesh(def);
  if (def.parent === "earth") {
    const angle = Math.random() * Math.PI * 2;
    mesh.userData.angle = angle;
    mesh.userData.orbitRadius = def.orbitRadius || 2.2;
    mesh.position.set(0, 0, 0); // placed relative to Earth each frame
  } else if (def.dist === 0 || def.dist == null) {
    mesh.position.set(0, 0, 0);
  } else {
    const angle = Math.random() * Math.PI * 2;
    mesh.position.set(Math.cos(angle) * def.dist, 0, Math.sin(angle) * def.dist);
    mesh.userData.angle = angle;
  }
  systemRoot.add(mesh);
  bodyMeshes[def.id] = mesh;
});

/* Keep a reference to system Earth separately from globeEarth */
const systemEarth = bodyMeshes.earth;

/* Invisible pick volume: Moon stays normal size visually, but is easier to click near Earth. */
(function attachMoonHitProxy() {
  const moon = bodyMeshes.moon;
  if (!moon) return;
  const def = BODIES.find((b) => b.id === "moon");
  const r = (def && def.radius) || 0.28;
  const hitR = Math.max(r * 2.4, 0.75); // pick only — not drawn
  const hit = new THREE.Mesh(
    new THREE.SphereGeometry(hitR, 16, 16),
    new THREE.MeshBasicMaterial({ visible: false, transparent: true, opacity: 0, depthWrite: false })
  );
  hit.userData.id = "moon";
  hit.userData.isHitProxy = true;
  moon.add(hit);
  moon.userData.hitProxy = hit;
})();

function updateMoonOrbit(dt, advance) {
  const moon = bodyMeshes.moon;
  const earth = bodyMeshes.earth;
  if (!moon || !earth) return;
  const def = BODIES.find((b) => b.id === "moon");
  const orbitR = (def && def.orbitRadius) || moon.userData.orbitRadius || 2.2;
  if (advance) {
    const period = (def && def.period) || 0.074;
    // Moon-only: much slower revolution; planet heliocentric speeds untouched
    const speed = 0.1 / Math.max(period, 0.05);
    moon.userData.angle = (moon.userData.angle || 0) + dt * speed;
  }
  const a = moon.userData.angle || 0;
  moon.position.copy(earth.position).add(
    new THREE.Vector3(Math.cos(a) * orbitR, Math.sin(a) * 0.15 * orbitR, Math.sin(a) * orbitR)
  );
  if (advance) moon.rotation.y += dt * 0.06;
}

function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}
function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }

function animateCamera(toPos, toTarget, duration, onDone) {
  return new Promise((resolve) => {
    const fromPos = camera.position.clone();
    const fromTarget = controls.target.clone();
    const start = performance.now();
    transitionLock = true;
    function step(now) {
      const u = Math.min(1, (now - start) / duration);
      const e = easeInOutCubic(u);
      camera.position.lerpVectors(fromPos, toPos, e);
      controls.target.lerpVectors(fromTarget, toTarget, e);
      controls.update();
      if (u < 1) requestAnimationFrame(step);
      else {
        transitionLock = false;
        if (onDone) onDone();
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}

async function enterGlobe() {
  if (phase !== "map" || transitionLock) return;
  transitionLock = true;
  phase = "globe";
  setPhaseDots(phase);
  hudLaunch.classList.add("hide");
  document.getElementById("map").classList.add("fade-out");
  canvas.classList.add("active");
  controls.enabled = true;
  applyGlobeFraming(true);
  globeEarth.visible = true;
  systemRoot.visible = false;
  setGlobeMoonVisible(true);
  globeKey.intensity = 1.35;
  sunLight.intensity = 0.55;
  if (typeof sunLightWarm !== "undefined") sunLightWarm.intensity = 0.2;
  await new Promise((r) => setTimeout(r, 200));
  transitionLock = false;
  document.getElementById("hudSystem").classList.remove("hide");
  setHintForPhase();
  setTimeout(() => hintEl.classList.add("hide"), 5000);
}

async function enterSystem() {
  if (phase !== "globe" || transitionLock) return;
  document.getElementById("hudSystem").classList.add("hide");
  phase = "system";
  setPhaseDots(phase);
  setHintForPhase();
  globeEarth.visible = false;
  setGlobeMoonVisible(false);
  systemRoot.visible = true;
  globeKey.intensity = 0.15;
  sunLight.intensity = 2.4;
  sunLight.position.set(0, 0, 0);
  if (typeof sunLightWarm !== "undefined") {
    sunLightWarm.intensity = 0.55;
    sunLightWarm.position.set(0, 0, 0);
  }
  currentBodyId = "earth";
  // Place Earth at a nice angle
  const eAngle = Math.PI * 0.35;
  systemEarth.userData.angle = eAngle;
  systemEarth.position.set(Math.cos(eAngle) * 28, 0, Math.sin(eAngle) * 28);
  updateMoonOrbit(0, false);
  // Phone: drop planet-follow so zoom orbits the Sun (whole system stays framed)
  selectedId = null;
  highlightRing.visible = false;
  try { selectCard.classList.remove("show"); } catch (_) {}
  if (isPhoneViewport() && scene.fog) {
    try { scene.fog.density = 0.00055; } catch (_) {}
  }
  applySystemOverview(false);
  await animateCamera(
    systemOverviewCam(),
    new THREE.Vector3(0, 0, 0),
    2200
  );
  // Re-assert after tween (damping / mid-gesture can leave target off-sun on phones)
  applySystemOverview(true);
  setTimeout(() => hintEl.classList.add("hide"), 6000);
}

/* wheel: map handled by leaflet; globe → system; Earth zoom-in → Tide */
canvas.addEventListener("wheel", (ev) => {
  if (transitionLock || handingOffToTide) return;
  if (phase === "globe") {
    // Zoom out near max distance → unfold solar system
    const outGate = isPhoneViewport() ? controls.maxDistance * 0.92 : 8.5;
    if (ev.deltaY > 0 && camera.position.distanceTo(controls.target) > outGate) {
      enterSystem();
      return;
    }
    // Zoom in: when Earth fills ~screen (dist≈2.72 ≈1.7×radius) → Tide flat map
    if (ev.deltaY < 0) {
      const dist = camera.position.distanceTo(controls.target);
      if (dist < GLOBE_TO_TIDE_DIST) goBackToTideMap();
    }
    return;
  }
  // System: Earth selected — zoom in toward Earth past threshold → Tide
  if (phase === "system" && selectedId === "earth") {
    if (ev.deltaY < 0) {
      const mesh = bodyMeshes.earth;
      if (mesh) {
        const dist = camera.position.distanceTo(mesh.position);
        const r = (BODIES.find((b) => b.id === "earth").radius) * mesh.scale.x;
        // Approach threshold while orbiting near selected Earth
        if (dist < Math.max(r * 6.5, 8.5)) goBackToTideMap();
      }
    }
  }
  // Inspecting Earth: keep zooming in past threshold → Tide
  if (phase === "inspect" && (inspectId === "earth" || currentBodyId === "earth")) {
    if (ev.deltaY < 0) {
      const mesh = bodyMeshes.earth;
      if (!mesh) return;
      const dist = camera.position.distanceTo(mesh.position);
      const thresh = Math.max(mesh.scale.x * (BODIES.find((b) => b.id === "earth").radius) * 2.35, 2.15);
      if (dist < thresh) goBackToTideMap();
    }
  }
}, { passive: true });

/* also allow a button-like second enter via keyboard */
window.addEventListener("keydown", (e) => {
  if (e.key === " " && phase === "globe") { e.preventDefault(); enterSystem(); }
});

/* Raycast select */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function getSelectableMeshes() {
  if (phase === "system") return Object.values(bodyMeshes);
  // Inspecting Earth: Moon stays nearby and must remain clickable (normal visual size)
  if (phase === "inspect" && inspectId === "earth") {
    const list = [];
    if (bodyMeshes.earth) list.push(bodyMeshes.earth);
    if (bodyMeshes.moon) list.push(bodyMeshes.moon);
    return list;
  }
  if (phase === "inspect" && inspectId === "moon") {
    const list = [];
    if (bodyMeshes.moon) list.push(bodyMeshes.moon);
    if (bodyMeshes.earth) list.push(bodyMeshes.earth);
    return list;
  }
  if (phase === "inspect" && inspectId && bodyMeshes[inspectId]) return [bodyMeshes[inspectId]];
  return [];
}

/** Open Moon science while viewing Earth — no exaggerated visual scale-up. */
function openMoonScienceNearEarth() {
  if (!bodyMeshes.moon) return;
  inspectId = "moon";
  setPhaseDots("inspect");
  setHintForPhase();
  selectCard.classList.remove("show");
  highlightRing.visible = false;
  // Keep Moon mesh at its normal scale (do not run fly scale boost)
  bodyMeshes.moon.scale.setScalar(1);
  fillPanel("moon");
  sidePanel.classList.add("open");
  sidePanel.setAttribute("aria-hidden", "false");
  try {
    controls.target.copy(bodyMeshes.moon.position);
    controls.minDistance = 0.55;
    controls.maxDistance = Math.max(controls.maxDistance, 28);
  } catch (_) {}
}

/** Screen-space distance from click to a body center (px). Keeps real Moon scale but makes it clickable. */
function screenDistToBody(clientX, clientY, mesh) {
  if (!mesh) return Infinity;
  const v = mesh.position.clone().project(camera);
  if (v.z > 1) return Infinity; // behind camera
  const rect = canvas.getBoundingClientRect();
  const sx = (v.x * 0.5 + 0.5) * rect.width + rect.left;
  const sy = (-v.y * 0.5 + 0.5) * rect.height + rect.top;
  const dx = clientX - sx;
  const dy = clientY - sy;
  return Math.hypot(dx, dy);
}

canvas.addEventListener("pointerdown", (ev) => {
  if (transitionLock) return;
  const canPick =
    phase === "system" ||
    phase === "globe" ||
    (phase === "inspect" && (inspectId === "earth" || inspectId === "moon"));
  if (!canPick) return;

  // Globe Earth view: pick the always-visible globeMoon twin
  if (phase === "globe" && globeMoon && globeMoon.visible) {
    const dMoon = screenDistToBody(ev.clientX, ev.clientY, globeMoon);
    const dEarth = screenDistToBody(ev.clientX, ev.clientY, globeEarth);
    if (dMoon < 56 && dMoon <= dEarth + 12) {
      // Open moon science using system moon panel content; keep globe view
      fillPanel("moon");
      sidePanel.classList.add("open");
      sidePanel.setAttribute("aria-hidden", "false");
      try { controls.target.copy(globeMoon.position); } catch (_) {}
      return;
    }
    return; // globe: only moon soft-pick for now (Earth stays navigable)
  }

  // While inspecting Earth: if click is near the Moon on screen, open Moon science
  // (Earth is closer in 3D so raycast alone always eats Moon clicks.)
  if (phase === "inspect" && (inspectId === "earth" || inspectId === "moon") && bodyMeshes.moon) {
    const dMoon = screenDistToBody(ev.clientX, ev.clientY, bodyMeshes.moon);
    const dEarth = screenDistToBody(ev.clientX, ev.clientY, bodyMeshes.earth);
    // Generous pixel radius — Moon keeps true mesh size; only the click target is easier
    const moonPickPx = 56;
    if (dMoon < moonPickPx && dMoon <= dEarth + 12) {
      openMoonScienceNearEarth();
      return;
    }
  }

  const rect = canvas.getBoundingClientRect();
  pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(getSelectableMeshes(), true);
  if (!hits.length) return;
  // Prefer Moon if it appears anywhere in the hit list during Earth inspect
  let picked = null;
  for (let i = 0; i < hits.length; i++) {
    let obj = hits[i].object;
    while (obj && !obj.userData.id && obj.parent) obj = obj.parent;
    if (obj && obj.userData.id === "moon") { picked = "moon"; break; }
    if (!picked && obj && obj.userData.id) picked = obj.userData.id;
  }
  if (!picked) return;
  if (phase === "inspect" && picked === "moon") {
    openMoonScienceNearEarth();
    return;
  }
  if (phase === "inspect" && inspectId === "moon" && picked === "earth") {
    inspectId = "earth";
    fillPanel("earth");
    sidePanel.classList.add("open");
    sidePanel.setAttribute("aria-hidden", "false");
    try { controls.target.copy(bodyMeshes.earth.position); } catch (_) {}
    return;
  }
  if (phase === "system") selectBody(picked);
});

function selectBody(id) {
  selectedId = id;
  const mesh = bodyMeshes[id];
  const def = BODIES.find((b) => b.id === id);
  if (!mesh || !def) return;
  highlightRing.visible = true;
  const s = def.radius * 1.05;
  highlightRing.scale.set(s, s, s);
  highlightRing.position.copy(mesh.position);
  // Frame the selected body so wheel zoom-in can approach it (Earth → Tide).
  // Phone: never clamp maxDistance / retarget to the planet — that locked the view
  // to a tiny slice of the system (maxDistance 70 around Earth).
  if (phase === "system") {
    if (isPhoneViewport()) {
      applySystemFramingLimits();
      controls.target.set(0, 0, 0);
    } else {
      controls.target.copy(mesh.position);
      if (id === "earth") {
        controls.minDistance = 1.35;
        controls.maxDistance = 70;
      } else {
        controls.minDistance = Math.max(def.radius * 2.2, 2.8);
        controls.maxDistance = 140;
      }
    }
  }
  refreshSelectCard();
  selectCard.classList.add("show");
}

function refreshSelectCard() {
  const def = BODIES.find((b) => b.id === selectedId);
  if (!def) return;
  document.getElementById("selName").textContent = lang === "zh" ? def.zh : def.en;
  document.getElementById("selEn").textContent = lang === "zh" ? def.en : def.zh;
  const fromDef = BODIES.find((b) => b.id === currentBodyId);
  const fromName = fromDef ? (lang === "zh" ? fromDef.zh : fromDef.en) : "Earth";
  const toName = lang === "zh" ? def.zh : def.en;
  const route = lang === "zh"
    ? `航线：${fromName} → ${toName}`
    : `Route: ${fromName} → ${toName}`;
  document.getElementById("selMeta").textContent =
    (lang === "zh" ? def.blurb_zh : def.blurb_en) + " · " + route;
  document.getElementById("selLabel").textContent = t("selLabel");
  document.getElementById("btnFly").textContent = t("fly");
  document.getElementById("btnDeselect").textContent = t("clear");
  const be = document.getElementById("btnBackEarth");
  if (be) be.textContent = t("backEarth");
  const flyBtn = document.getElementById("btnFly");
  // Same body: open inspect without a long flight
  if (def.id === currentBodyId) {
    flyBtn.textContent = lang === "zh" ? "检视 · Inspect" : "Inspect · 检视";
  }
}

document.getElementById("btnDeselect").onclick = () => {
  selectedId = null;
  highlightRing.visible = false;

/** From travel/system/inspect: return to standalone 3D Earth globe; zoom in close → Tide map. */
async function returnToEarthGlobe() {
  if (handingOffToTide || transitionLock) return;
  if (phase === "globe") {
    setHintForPhase();
    hintEl.classList.remove("hide");
    setTimeout(() => hintEl.classList.add("hide"), 4000);
    return;
  }
  if (phase === "map") {
    await enterGlobe();
    return;
  }

  selectCard.classList.remove("show");
  sidePanel.classList.remove("open");
  sidePanel.setAttribute("aria-hidden", "true");
  highlightRing.visible = false;
  flyOverlay.classList.remove("show");
  selectedId = null;
  inspectId = null;
  Object.values(bodyMeshes).forEach((m) => m.scale.set(1, 1, 1));

  phase = "globe";
  setPhaseDots(phase);
  systemRoot.visible = false;
  globeEarth.visible = true;
  setGlobeMoonVisible(true);
  canvas.classList.add("active");
  const mapEl = document.getElementById("map");
  if (mapEl) mapEl.classList.add("fade-out");
  hudLaunch.classList.add("hide");
  const hudSys = document.getElementById("hudSystem");
  if (hudSys) hudSys.classList.remove("hide");

  globeKey.intensity = 1.35;
  sunLight.intensity = 0.55;
  if (typeof sunLightWarm !== "undefined") sunLightWarm.intensity = 0.2;

  controls.enabled = true;
  applyGlobeFraming(false);
  currentBodyId = "earth";

  setHintForPhase();
  await animateCamera(
    globeCamPos(),
    new THREE.Vector3(0, 0, 0),
    1400
  );
  setTimeout(() => hintEl.classList.add("hide"), 5500);
}

/** Crossfade WebGL → void → Tide Itinerary (index.html). Keep globe visible until veil covers. */
function goBackToTideMap() {
  if (handingOffToTide) return;
  handingOffToTide = true;
  transitionLock = true;
  selectCard.classList.remove("show");
  sidePanel.classList.remove("open");
  sidePanel.setAttribute("aria-hidden", "true");
  highlightRing.visible = false;
  controls.enabled = false;
  // Prep Leaflet under the veil for Tide return (wide world zoom)
  try {
    map.setView([20, 20], 2);
    map.invalidateSize();
  } catch (_) {}
  const fadeEl = document.getElementById("pageFade");
  // Hold / nudge camera closer while void veil rises over the live WebGL frame
  const camLen = camera.position.length();
  const closer = camera.position.clone().normalize().multiplyScalar(Math.max(camLen * 0.82, 2.05));
  const holdTarget = controls.target.clone();
  animateCamera(closer, holdTarget, 480);
  if (fadeEl) {
    fadeEl.classList.remove("instant");
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { fadeEl.classList.add("show"); });
    });
  }
  // ~1000ms total: camera nudge + void crossfade, then navigate
  setTimeout(() => { location.href = "index.html?from=interstellar"; }, 1050);
}

function fillPanel(id) {
  const def = BODIES.find((b) => b.id === id);
  if (!def) return;
  document.getElementById("panelTitle").textContent = lang === "zh" ? def.zh : def.en;
  document.getElementById("panelEn").textContent = lang === "zh" ? def.en : def.zh;
  const body = document.getElementById("panelBody");
  let html = "";
  html += `<span class="tag">${def.en}</span>`;
  if (def.rich) html += `<span class="tag">${lang === "zh" ? "深度地质" : "Deep geology"}</span>`;
  html += `<p>${lang === "zh" ? def.blurb_zh : def.blurb_en}</p>`;

  if (def.id === "mars") {
    const g = MARS_GEO[lang] || MARS_GEO.zh;
    html += `<h3>${lang === "zh" ? "地质概览" : "Geology overview"}</h3><p>${g.intro}</p>`;
    g.sections.forEach((s) => {
      html += `<h3>${s.title}</h3><p>${s.body}</p>`;
    });
  } else {
    html += `<h3>${lang === "zh" ? "科普速览" : "Quick science"}</h3>`;
    html += `<p>${lang === "zh" ? def.blurb_zh : def.blurb_en}</p>`;
    if (def.id === "earth") {
      html += `<p>${lang === "zh"
        ? "板块构造推开海洋盆地、抬升山脉；大气与水圈循环塑造气候带。从轨道回望，陆地呈暖色，海洋深蓝，极地与云系为白。继续放大地球可回到潮汐行程地图。"
        : "Plate tectonics open ocean basins and raise mountains; atmosphere and hydrosphere sculpt climate belts. Keep zooming in on Earth to return to the Tide itinerary map."}</p>`;
    }
    if (def.id === "moon") {
      html += `<p>${lang === "zh"
        ? "月球平均距离约 38 万公里，潮汐力塑造地球海洋潮汐。正面月海是古老玄武岩平原，背面高地更古老、撞击更密。阿波罗与月球勘测轨道器（LRO）揭示了月壳、月幔与水冰线索。"
        : "At ~384,000 km, the Moon drives Earth's ocean tides. Near-side maria are ancient basalt plains; the far side is older and more heavily cratered. Apollo and LRO mapped crust, mantle clues, and polar water ice."}</p>`;
    }
  }

  const imgs = def.id === "mars" ? MARS_GEO.images : (BODY_IMAGES[def.id] || []);
  if (imgs && imgs.length) {
    html += `<h3>${lang === "zh" ? "NASA 影像资料" : "NASA imagery"}</h3>`;
    imgs.forEach((img) => {
      html += `<figure class="geo-card"><img src="${img.src}" alt="${img.title_en}" loading="lazy" referrerpolicy="no-referrer" />
        <figcaption><strong>${lang === "zh" ? img.title_zh : img.title_en}</strong>${img.credit}</figcaption></figure>`;
    });
  }

  html += `<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">
    <button type="button" class="chip" id="btnBackSystem">${t("backSystem")}</button>
    <button type="button" class="chip accent" id="btnPanelTide">${t("backEarth")}</button>
  </div>`;
  body.innerHTML = html;
  const b = document.getElementById("btnBackSystem");
  if (b) b.onclick = () => returnToSystem();
  const bt = document.getElementById("btnPanelTide");
  if (bt) bt.onclick = () => returnToEarthGlobe();
}

async function flyToBody(id) {
  if (transitionLock) return;
  const def = BODIES.find((b) => b.id === id);
  const mesh = bodyMeshes[id];
  if (!def || !mesh) return;

  // Already at this body: open inspect panel without a long transit
  if (id === currentBodyId && phase === "system") {
    phase = "inspect";
    inspectId = id;
    setPhaseDots(phase);
    setHintForPhase();
    selectCard.classList.remove("show");
    highlightRing.visible = false;
    const dest = mesh.position.clone();
    const viewDist = Math.max(def.radius * 4.5, 3.5);
    controls.minDistance = Math.max(def.radius * (def.id === "earth" ? 1.15 : def.id === "mars" ? 1.8 : 2.8), def.id === "earth" ? 1.05 : 1.6);
    controls.maxDistance = Math.max(def.radius * 18, 20);
    await animateCamera(
      dest.clone().add(new THREE.Vector3(viewDist * 0.85, viewDist * 0.45, viewDist)),
      dest,
      900
    );
    fillPanel(id);
    sidePanel.classList.add("open");
    sidePanel.setAttribute("aria-hidden", "false");
    return;
  }

  phase = "fly";
  setPhaseDots(phase);
  selectCard.classList.remove("show");
  highlightRing.visible = false;
  flyOverlay.classList.add("show");
  controls.enabled = false;
  transitionLock = true;

  const originMesh = bodyMeshes[currentBodyId] || systemEarth;
  const originPos = originMesh.position.clone();

  // Lift off near current body
  const lift = originPos.clone().add(new THREE.Vector3(4, 3, 6));
  await animateCamera(lift, originPos, 900);
  transitionLock = true;
  controls.enabled = false;

  const dest = mesh.position.clone();
  const viewDist = Math.max(def.radius * 4.5, 3.5);
  const endCam = dest.clone().add(new THREE.Vector3(viewDist * 0.85, viewDist * 0.45, viewDist));
  const mid = originPos.clone().lerp(dest, 0.5).add(new THREE.Vector3(0, viewDist * 1.8, 0));

  const fromPos = camera.position.clone();
  const fromT = controls.target.clone();
  const t0 = performance.now();
  const dur = 3200;
  const baseScale = mesh.scale.x;

  await new Promise((resolve) => {
    function step(now) {
      const u = Math.min(1, (now - t0) / dur);
      const e = easeInOutCubic(u);
      const camPos = new THREE.Vector3(
        (1 - e) * (1 - e) * fromPos.x + 2 * (1 - e) * e * mid.x + e * e * endCam.x,
        (1 - e) * (1 - e) * fromPos.y + 2 * (1 - e) * e * mid.y + e * e * endCam.y,
        (1 - e) * (1 - e) * fromPos.z + 2 * (1 - e) * e * mid.z + e * e * endCam.z
      );
      camera.position.copy(camPos);
      controls.target.copy(fromT.clone().lerp(dest, easeOutQuart(u)));
      const sc = 1 + easeOutQuart(u) * (def.id === "mars" ? 2.2 : def.id === "sun" ? 0.35 : def.id === "earth" ? 1.6 : def.id === "moon" ? 2.8 : 1.4);
      mesh.scale.setScalar(baseScale * sc);
      if (u < 1) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });

  flyOverlay.classList.remove("show");
  phase = "inspect";
  inspectId = id;
  currentBodyId = id;
  setPhaseDots(phase);
  setHintForPhase();
  controls.enabled = true;
  controls.minDistance = Math.max(def.radius * (def.id === "earth" ? 1.15 : def.id === "mars" ? 1.8 : 2.8), def.id === "earth" ? 1.05 : 1.6);
  controls.maxDistance = Math.max(def.radius * 18, 20);
  controls.target.copy(dest);
  transitionLock = false;
  fillPanel(id);
  sidePanel.classList.add("open");
  sidePanel.setAttribute("aria-hidden", "false");
  setTimeout(() => hintEl.classList.add("hide"), 5000);
}

async function returnToSystem() {
  if (transitionLock) return;
  sidePanel.classList.remove("open");
  sidePanel.setAttribute("aria-hidden", "true");
  // reset scales
  Object.values(bodyMeshes).forEach((m) => m.scale.set(1, 1, 1));
  selectedId = null;
  inspectId = null;
  phase = "system";
  setPhaseDots(phase);
  setHintForPhase();
  applySystemFramingLimits();
  // Frame from a vantage near current body if known
  const cur = bodyMeshes[currentBodyId];
  if (isPhoneViewport()) {
    await animateCamera(systemOverviewCam(), new THREE.Vector3(0, 0, 0), 1600);
  } else {
    const look = cur ? cur.position.clone() : new THREE.Vector3(0, 0, 0);
    const cam = look.clone().add(new THREE.Vector3(18, 28, 48));
    if (cam.length() < 40) cam.set(18, 28, 72);
    await animateCamera(cam, new THREE.Vector3(0, 0, 0), 1600);
  }
}

document.getElementById("btnClosePanel").onclick = () => returnToSystem();

/* Resize */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1);
  syncPhoneCameraOptics();
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setSize(window.innerWidth, window.innerHeight);
  map.invalidateSize();
  if (phase === "globe" && controls.enabled) {
    applyGlobeFraming(false);
  } else if ((phase === "system" || phase === "fly") && controls.enabled) {
    applySystemFramingLimits();
    if (isPhoneViewport()) controls.target.set(0, 0, 0);
  }
});


/* Animate loop */
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  const tsec = clock.elapsedTime;

  if (globeEarth.visible && phase === "globe") {
    globeEarth.rotation.y += dt * 0.05;
    if (globeEarth.userData.clouds) globeEarth.userData.clouds.rotation.y += dt * 0.07;
    if (globeMoon) {
      setGlobeMoonVisible(true);
      updateGlobeMoonOrbit(dt, true);
    }
  } else if (globeMoon && phase !== "globe") {
    globeMoon.visible = false;
  }

  if (systemRoot.visible && (phase === "system" || phase === "fly")) {
    BODIES.forEach((def) => {
      const mesh = bodyMeshes[def.id];
      if (!mesh) return;
      // Moon (and other satellites): not heliocentric
      if (def.parent) return;
      if (def.dist === 0 || def.dist == null) {
        mesh.rotation.y += dt * 0.08;
        return;
      }
      if (phase === "system") {
        const speed = 0.12 / Math.max(def.period, 0.2);
        mesh.userData.angle = (mesh.userData.angle || 0) + dt * speed;
        mesh.position.x = Math.cos(mesh.userData.angle) * def.dist;
        mesh.position.z = Math.sin(mesh.userData.angle) * def.dist;
      }
      mesh.rotation.y += dt * 0.25;
      if (mesh.userData.clouds) mesh.userData.clouds.rotation.y += dt * 0.3;
    });
    // Moon revolves around Earth (visual orbit) while system is interactive
    updateMoonOrbit(dt, phase === "system" || (phase === "inspect" && (inspectId === "earth" || inspectId === "moon")));
    if (selectedId && bodyMeshes[selectedId] && highlightRing.visible) {
      highlightRing.position.copy(bodyMeshes[selectedId].position);
      highlightRing.rotation.z = tsec * 0.4;
      // Desktop/tablet: orbit the selection. Phone: keep Sun as orbit center so pinch-out shows the full system.
      if (!isPhoneViewport()) {
        controls.target.copy(bodyMeshes[selectedId].position);
      } else if (controls.target.lengthSq() > 0.01) {
        controls.target.set(0, 0, 0);
      }
    }
  }

  if (phase === "inspect" && inspectId && bodyMeshes[inspectId]) {
    bodyMeshes[inspectId].rotation.y += dt * 0.12;
    if (bodyMeshes[inspectId].userData.clouds) {
      bodyMeshes[inspectId].userData.clouds.rotation.y += dt * 0.16;
    }
  }

  // Gentle sun emissive pulse (textured body only — no glow shells)
  const sunMesh = bodyMeshes.sun;
  if (sunMesh && sunMesh.material && sunMesh.material.emissiveIntensity != null) {
    sunMesh.material.emissiveIntensity = 0.5 + Math.sin(tsec * 1.1) * 0.05;
  }

  // Dolly proximity safety net (trackpad / continuous zoom / pinch)
  if (!handingOffToTide && !transitionLock) {
    if (phase === "globe") {
      const dist = camera.position.distanceTo(controls.target);
      if (dist < GLOBE_TO_TIDE_DIST - 0.08) goBackToTideMap();
      else if (dist >= controls.maxDistance * 0.97) enterSystem();
    } else if (phase === "inspect" && (inspectId === "earth" || currentBodyId === "earth")) {
      const mesh = bodyMeshes.earth;
      if (mesh) {
        const dist = camera.position.distanceTo(mesh.position);
        const r = (BODIES.find((b) => b.id === "earth").radius) * mesh.scale.x;
        if (dist < r * 2.2) goBackToTideMap();
      }
    } else if (phase === "system" && selectedId === "earth") {
      const mesh = bodyMeshes.earth;
      if (mesh) {
        const dist = camera.position.distanceTo(mesh.position);
        const r = (BODIES.find((b) => b.id === "earth").radius) * mesh.scale.x;
        if (dist < Math.max(r * 5.5, 7.5)) goBackToTideMap();
      }
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
tick();

applyLangUI();
setPhaseDots("map");

/* Continuous handoff from Tide: skip map pause and enter Earth globe */
(function bootFromTide() {
  try {
    const params = new URLSearchParams(location.search || "");
    if (params.get("from") === "tide") {
      const mapEl = document.getElementById("map");
      const fadeEl = document.getElementById("pageFade");
      // Continue inbound void: start covered, map already faded, WebGL ready
      if (mapEl) mapEl.classList.add("fade-out");
      if (fadeEl) {
        fadeEl.classList.add("instant", "show");
      }
      // Enter globe immediately under the veil (no empty-map pause)
      requestAnimationFrame(() => {
        if (phase === "map" && !transitionLock) enterGlobe();
        // Then lift the veil so the globe appears as a continuous crossfade
        requestAnimationFrame(() => {
          if (fadeEl) {
            fadeEl.classList.remove("instant");
            requestAnimationFrame(() => { fadeEl.classList.remove("show"); });
          }
        });
      });
      try {
        const u = new URL(location.href);
        u.searchParams.delete("from");
        // keep v= for cache bust
        history.replaceState(null, "", u.pathname + (u.search || "") + u.hash);
      } catch (_) {}
      return;
    }
  } catch (_) {}
  /* Auto-hint: after a moment show enter button pulse */
  setTimeout(() => {
    if (phase === "map") hudLaunch.classList.remove("hide");
  }, 1200);
})();
  </script>
